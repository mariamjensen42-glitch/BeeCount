name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BEECOUNT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/beecount-release.jks"

      - name: Build signed optimized release APK
        env:
          BEECOUNT_KEYSTORE_PATH: ${{ runner.temp }}/beecount-release.jks
          BEECOUNT_STORE_PASSWORD: ${{ secrets.BEECOUNT_STORE_PASSWORD }}
          BEECOUNT_KEY_ALIAS: ${{ secrets.BEECOUNT_KEY_ALIAS }}
          BEECOUNT_KEY_PASSWORD: ${{ secrets.BEECOUNT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Compute SHA-256
        id: checksum
        working-directory: app/build/outputs/apk/release
        run: |
          sha256sum app-release.apk > SHA-256.txt
          echo "sha256=$(awk '{print $1}' SHA-256.txt)" >> "$GITHUB_OUTPUT"

      - name: Draft release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo '## BeeCount ${{ github.ref_name }}'
            echo ''
            echo '自动发布（GitHub Actions）。'
            echo ''
            echo '- 版本号：`${{ github.ref_name }}`'
            echo '- APK 已通过单元测试、R8 优化、签名构建与签名校验'
            echo '- SHA-256：`${{ steps.checksum.outputs.sha256 }}`'
            echo ''
            echo "### 变更（自 ${PREV:-首个提交} 起）"
            echo ''
            if [ -n "$PREV" ]; then
              git log --oneline --no-decorate "$PREV..HEAD"
            else
              git log --oneline --no-decorate
            fi
          } > /tmp/notes.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SHA-256.txt --title "BeeCount ${{ github.ref_name }}" --notes-file /tmp/notes.txt
